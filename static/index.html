<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPnP WAN Exporter</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    padding: 3rem 1rem;
  }
  .wrap { width: 100%; max-width: 820px; }
  h1 { font-size: 1.5rem; margin: 0 0 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
  .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.5rem; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .dot.up { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
  .dot.down { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .status { font-size: 1.5rem; margin-left: 0.5rem; }
  .status.up { color: #22c55e; }
  .status.down { color: #ef4444; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.1rem 1.25rem;
  }
  .card .label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; }
  .card .value { font-size: 1.6rem; font-weight: 600; margin-top: 0.35rem; word-break: break-word; }
  .card .raw { font-size: 0.8rem; color: #64748b; margin-top: 0.25rem; }
  .chart-card { margin-top: 1rem; }
  .chart-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 0.85rem; }
  .chart-head .title { font-size: 0.95rem; font-weight: 600; }
  .legend { display: flex; gap: 1rem; font-size: 0.8rem; color: #94a3b8; }
  .legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .range { display: inline-flex; border: 1px solid #334155; border-radius: 8px; overflow: hidden; }
  .range button { background: transparent; color: #94a3b8; border: 0; padding: 0.35rem 0.7rem; font-size: 0.8rem; cursor: pointer; }
  .range button.active { background: #334155; color: #e2e8f0; }
  #chart { width: 100%; height: 260px; display: block; }
  .banner {
    background: #7f1d1d;
    border: 1px solid #b91c1c;
    color: #fecaca;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    margin-bottom: 1.25rem;
    font-size: 0.9rem;
  }
  footer { margin-top: 1.75rem; color: #64748b; font-size: 0.8rem; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  a { color: #60a5fa; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner" style="display:none"></div>
  <h1>UPnP WAN Exporter <span class="dot down" id="statusDot"></span><span class="status down" id="statusText">&mdash;</span></h1>
  <div class="sub">Live WAN traffic counters reported by the router.</div>

  <div class="grid">
    <div class="card">
      <div class="label">Bytes Sent</div>
      <div class="value" id="bytesSentHuman">&mdash;</div>
      <div class="raw" id="bytesSentRaw">&mdash;</div>
    </div>
    <div class="card">
      <div class="label">Bytes Received</div>
      <div class="value" id="bytesReceivedHuman">&mdash;</div>
      <div class="raw" id="bytesReceivedRaw">&mdash;</div>
    </div>
    <div class="card">
      <div class="label">Packets Sent</div>
      <div class="value" id="packetsSent">&mdash;</div>
    </div>
    <div class="card">
      <div class="label">Packets Received</div>
      <div class="value" id="packetsReceived">&mdash;</div>
    </div>
  </div>

  <div class="card chart-card">
    <div class="chart-head">
      <div class="title">WAN Throughput</div>
      <div class="legend">
        <span><span class="swatch" style="background:#38bdf8"></span>Download</span>
        <span><span class="swatch" style="background:#f59e0b"></span>Upload</span>
      </div>
      <div class="range" id="range">
        <button data-range="1800">30m</button>
        <button data-range="3600" class="active">1h</button>
      </div>
    </div>
    <canvas id="chart"></canvas>
  </div>

  <footer>
    <span>Last updated: <span id="updated">--:--:--</span></span>
    <span><a href="/metrics">/metrics</a> &middot; <a href="/stats">/stats</a> &middot; <a href="/stats?format=json">/stats?format=json</a></span>
  </footer>
</div>

<script>
  function formatBytes(bytes) {
    const units = ["B", "KB", "MB", "GB", "TB"];
    bytes = Number(bytes) || 0;
    if (bytes < 1024) return bytes + " B";
    let value = bytes;
    let i = 0;
    while (value >= 1024 && i < units.length - 1) { value /= 1024; i++; }
    return value.toFixed(2) + " " + units[i];
  }

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el) el.textContent = value;
  }

  function setStatus(status) {
    const up = status === "Up";
    const text = status || "Unknown";
    const dot = document.getElementById("statusDot");
    const label = document.getElementById("statusText");
    if (dot) dot.className = "dot " + (up ? "up" : "down");
    if (label) {
      label.className = "status " + (up ? "up" : "down");
      label.textContent = text;
    }
  }

  function showBanner(message) {
    const banner = document.getElementById("banner");
    if (!banner) return;
    banner.textContent = "\u26a0\ufe0f " + message;
    banner.style.display = "block";
  }

  function hideBanner() {
    const banner = document.getElementById("banner");
    if (banner) banner.style.display = "none";
  }

  // ---- Client-side history: nothing is stored on the server ----
  const MAX_WINDOW = 3600;   // keep up to 1 hour of points in memory
  let rangeSecs = 3600;      // currently displayed window
  let points = [];           // { t, bytes_sent, bytes_received }

  function niceCeil(v) {
    let p = 1;
    while (p < v) p *= 2;
    return p;
  }

  function drawChart() {
    const canvas = document.getElementById("chart");
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const cssW = canvas.clientWidth || canvas.parentElement.clientWidth || 600;
    const cssH = 260;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);

    const now = Math.floor(Date.now() / 1000);
    const start = now - rangeSecs;
    const pts = points.filter(function (p) { return p.t >= start - 1; });

    if (pts.length < 2) {
      ctx.fillStyle = "#64748b";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Collecting data\u2026", cssW / 2, cssH / 2);
      return;
    }

    // Throughput in bytes/second between consecutive samples.
    const series = [];
    for (let i = 1; i < pts.length; i++) {
      const dt = pts[i].t - pts[i - 1].t;
      if (dt <= 0) continue;
      series.push({
        t: pts[i].t,
        rx: Math.max(0, (pts[i].bytes_received - pts[i - 1].bytes_received) / dt),
        tx: Math.max(0, (pts[i].bytes_sent - pts[i - 1].bytes_sent) / dt)
      });
    }
    if (series.length === 0) return;

    const pad = { top: 14, right: 14, bottom: 24, left: 68 };
    const plotW = Math.max(10, cssW - pad.left - pad.right);
    const plotH = Math.max(10, cssH - pad.top - pad.bottom);

    let maxVal = 0;
    series.forEach(function (s) { maxVal = Math.max(maxVal, s.rx, s.tx); });
    const niceMax = niceCeil(maxVal > 0 ? maxVal : 1);

    const xFor = function (t) { return pad.left + ((t - start) / rangeSecs) * plotW; };
    const yFor = function (v) { return pad.top + plotH - (v / niceMax) * plotH; };

    // Grid + Y axis labels
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const steps = 4;
    for (let i = 0; i <= steps; i++) {
      const v = niceMax * i / steps;
      const y = yFor(v);
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + plotW, y);
      ctx.stroke();
      ctx.fillStyle = "#64748b";
      ctx.fillText(formatBytes(v) + "/s", pad.left - 8, y);
    }

    // X axis labels
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = "#64748b";
    for (let i = 0; i <= 4; i++) {
      const t = start + rangeSecs * i / 4;
      const minsAgo = Math.round((now - t) / 60);
      ctx.fillText(minsAgo <= 0 ? "now" : "-" + minsAgo + "m", xFor(t), pad.top + plotH + 6);
    }

    function drawLine(key, color) {
      ctx.beginPath();
      series.forEach(function (s, i) {
        const x = xFor(s.t);
        const y = yFor(s[key]);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.stroke();
    }
    drawLine("rx", "#38bdf8");
    drawLine("tx", "#f59e0b");
  }

  async function refresh() {
    try {
      const res = await fetch("stats?format=json", { cache: "no-store" });
      if (!res.ok) {
        const message = await res.text();
        showBanner(message ? "Failed to read live data: " + message : "HTTP " + res.status);
        setStatus("Disconnected");
        setText("updated", new Date().toLocaleTimeString());
        return;
      }
      hideBanner();

      const d = await res.json();
      const sent = Number(d.bytes_sent) || 0;
      const recv = Number(d.bytes_received) || 0;

      setStatus(d.connection_status);
      setText("bytesSentHuman", formatBytes(sent));
      setText("bytesSentRaw", sent.toLocaleString() + " bytes");
      setText("bytesReceivedHuman", formatBytes(recv));
      setText("bytesReceivedRaw", recv.toLocaleString() + " bytes");
      setText("packetsSent", (Number(d.packets_sent) || 0).toLocaleString());
      setText("packetsReceived", (Number(d.packets_received) || 0).toLocaleString());

      // Store this reading locally so the chart can grow over time.
      const t = Math.floor(Date.now() / 1000);
      if (points.length && points[points.length - 1].t === t) {
        points[points.length - 1] = { t: t, bytes_sent: sent, bytes_received: recv };
      } else {
        points.push({ t: t, bytes_sent: sent, bytes_received: recv });
      }
      const cutoff = t - MAX_WINDOW;
      while (points.length && points[0].t < cutoff) points.shift();

      drawChart();
    } catch (e) {
      // Keep showing the last known values on transient errors.
      showBanner("Failed to read live data: " + e);
    }
    setText("updated", new Date().toLocaleTimeString());
  }

  document.getElementById("range").addEventListener("click", function (e) {
    const btn = e.target.closest ? e.target.closest("button[data-range]") : null;
    if (!btn) return;
    rangeSecs = Number(btn.dataset.range) || 3600;
    const buttons = document.querySelectorAll("#range button");
    for (let i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", buttons[i] === btn);
    }
    drawChart();
  });

  window.addEventListener("resize", drawChart);

  setInterval(refresh, 5000);
  refresh();
</script>
</body>
</html>
